name: arcana

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      TLS_MODE: ${TLS_MODE}
      LAUNCHED: ${LAUNCHED}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/parts:ro
      - ../site/dist:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      READER_PROVIDER: ${READER_PROVIDER:-claude}
      READER_MODEL: ${READER_MODEL:-claude-haiku-5-5}
      READER_EFFORT: ${READER_EFFORT:-medium}
      GUARD_MODEL: ${GUARD_MODEL:-claude-haiku-5-5}
      JUDGE_MODEL: ${JUDGE_MODEL:-claude-sonnet-5-5}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-5}
      GUARD_BUDGET_USD: ${GUARD_BUDGET_USD:-1}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      GOOGLE_SIGNIN: ${GOOGLE_SIGNIN:-}

volumes:
  caddy_data:
  caddy_config:
