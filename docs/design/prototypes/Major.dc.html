<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Major Arcana</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
a,button{min-height:44px}
a{display:inline-flex;align-items:center}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
a{color:#8E4A62}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #F7F2EC; color: #241E36; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 16px 0 20px; border-bottom: 1px solid #E6DDD2">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" stroke="#8E4A62" stroke-width="2.5"/><path d="M39 14a19 19 0 1 0 0 36A15 15 0 1 1 39 14Z" stroke="#8E4A62" stroke-width="3"/></svg>Arcana Diary</span>
<button aria-label="Open menu" style="width: 44px; height: 44px; border: none; background: transparent; color: #241E36; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h16M3 15h16"/></svg></button>
</header>
<nav aria-label="Breadcrumb" style="padding: 16px 20px 0; font-size: 14px; color: #5B5470; display: flex; gap: 8px">
<a href="#">Home</a><span aria-hidden="true">›</span><a href="Hub.dc.html">Cards</a><span aria-hidden="true">›</span><span aria-current="page" style="color: #241E36">Major Arcana</span>
</nav>
<section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 44px; line-height: 1.05; font-weight: 500">The 22 Major Arcana</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #5B5470">The big themes of a life, from The Fool's first step to The World's completion. When one appears, the reading is about something that matters.</p>
</section>
<ol style="list-style: none; margin: 20px 0 0; padding: 0 20px; display: flex; flex-direction: column">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="22">
<li style="border-bottom: 1px solid #E6DDD2">
<a href="CardMoon.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 0; color: #241E36; text-decoration: none">
<span style="width: 44px; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: #7E6022">{{c.n}}</span>
<span style="font-size: 16px; font-weight: 600; flex: 1">{{c.name}}</span>
<span style="font-size: 14px; color: #5B5470">{{c.k}}</span>
</a>
</li>
</sc-for>
</ol>
<a href="Night1.dc.html" style="margin: 24px 20px 0; height: 52px; border-radius: 999px; background: #241E36; color: #FFFFFF; font: 600 16px Manrope, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Draw a card for your question</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
const d = [['0','The Fool','beginnings'],['I','The Magician','skill'],['II','The High Priestess','intuition'],['III','The Empress','care'],['IV','The Emperor','structure'],['V','The Hierophant','tradition'],['VI','The Lovers','choice'],['VII','The Chariot','will'],['VIII','Strength','courage'],['IX','The Hermit','reflection'],['X','Wheel of Fortune','change'],['XI','Justice','fairness'],['XII','The Hanged Man','pause'],['XIII','Death','endings'],['XIV','Temperance','balance'],['XV','The Devil','attachment'],['XVI','The Tower','upheaval'],['XVII','The Star','hope'],['XVIII','The Moon','uncertainty'],['XIX','The Sun','joy'],['XX','Judgement','awakening'],['XXI','The World','completion']];
return { cards: d.map(([n, name, k]) => ({ n, name, k })) };
}
}
</script>
</body>
</html>
