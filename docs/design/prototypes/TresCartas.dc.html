<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tirada de 3 cartas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;overflow:hidden}
a,button{min-height:44px}
a{display:inline-flex;align-items:center}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
a{color:#8E4A62}
input::placeholder{color:#B9B4CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F2EC; color: #241E36; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 16px 0 20px; border-bottom: 1px solid #E6DDD2">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="30" stroke="#8E4A62" stroke-width="2.5"/><path d="M39 14a19 19 0 1 0 0 36A15 15 0 1 1 39 14Z" stroke="#8E4A62" stroke-width="3"/></svg>Arcana Diary</span>
<button aria-label="Abrir menú" style="width: 44px; height: 44px; border: none; background: transparent; color: #241E36; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h16M3 15h16"/></svg></button>
</header>
<nav aria-label="Ruta" style="padding: 16px 20px 0; font-size: 14px; color: #5B5470; display: flex; gap: 8px">
<a href="HomeES.dc.html">Inicio</a><span aria-hidden="true">›</span><span aria-current="page" style="color: #241E36">3 cartas</span>
</nav>
<section style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 44px; line-height: 1.04; font-weight: 500">Tarot gratis de 3 cartas</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #5B5470">Pasado, presente y siguiente paso. Tres cartas para mirar tu pregunta con calma.</p>
</section>
<section aria-label="Tirada" style="margin: 24px 12px 0; border-radius: 28px; background: #10163A; color: #F1ECE2; padding: 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: center; gap: 12px">
<sc-for list="{{pos}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 92px; height: 158px; box-sizing: border-box; border-radius: 10px; border: 1px solid #C9A45C; background: #10163A; padding: 4px">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid rgba(201,164,92,0.55); display: flex; align-items: center; justify-content: center">
<svg width="51" height="51" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="27" stroke="#C9A45C" stroke-width="0.8" stroke-dasharray="1.5 3"/><circle cx="32" cy="32" r="21" stroke="#C9A45C" stroke-width="0.8"/><path d="M37 18a14 14 0 1 0 0 28A11 11 0 1 1 37 18Z" stroke="#C9A45C" stroke-width="1.4"/><path d="M32 2v6M32 56v6M2 32h6M56 32h6" stroke="#C9A45C" stroke-width="0.8"/><circle cx="41" cy="24" r="1.1" fill="#C9A45C"/><circle cx="44" cy="32" r="0.8" fill="#C9A45C"/><circle cx="41" cy="40" r="0.8" fill="#C9A45C"/></svg>
</div>
</div>
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #B9B4CC">{{p}}</span>
</div>
</sc-for>
</div>
<label for="q-3" style="font-size: 14px; color: #B9B4CC">Tu pregunta — opcional</label>
<input id="q-3" type="text" placeholder="p. ej. ¿Qué necesito ver de esta situación?" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9A45C; background: #161E48; color: #F1ECE2; font: 16px Manrope, sans-serif; padding: 0 16px">
<button style="height: 52px; border: none; border-radius: 999px; background: #C9A45C; color: #10163A; font: 700 16px Manrope, sans-serif">Saca tres cartas</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return { pos: ['Pasado', 'Presente', 'Siguiente paso'] }; }
}
</script>
</body>
</html>
